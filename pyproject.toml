[project]
name = "agent-ready-scanner"
version = "0.1.0"
description = "Deterministic agent-readiness scoring for business websites: can an AI agent read, understand, and act on this site?"
requires-python = ">=3.14"
license = { text = "All rights reserved" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "loguru>=0.7",
]

[project.scripts]
agent-ready-scan = "agent_ready_scanner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ready_scanner"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLR0915", "PLR0913", "ERA001", "PLR2044"]

[tool.ruff.lint.per-file-ignores]
"src/agent_ready_scanner/services/report.py" = ["E501"]  # CSS/HTML template literals

[tool.ruff.lint.pylint]
max-statements = 25
max-args = 5

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
